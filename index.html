<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDORA | Premium Hospital Scheduling</title>
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="src/styles/design-tokens.css">
    <link rel="stylesheet" href="src/styles/charts.css">
    
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Recharts & PropTypes -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    
    <!-- Babel Standalone (for in-browser JSX compilation) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div id="root"></div>

    <!-- App Scripts (Loaded sequentially into global scope) -->
    <script type="text/babel" src="src/context/api.jsx"></script>
    <script type="text/babel" src="src/context/store.jsx"></script>
    <script type="text/babel" src="src/context/engine.jsx"></script>
    
    <script type="text/babel" src="src/components/NavigationRail.jsx"></script>
    <script type="text/babel" src="src/components/AppointmentDrawer.jsx"></script>
    
    <!-- Charts -->
    <script type="text/babel" src="src/components/charts/DepartmentCoverageChart.jsx"></script>
    <script type="text/babel" src="src/components/charts/DutyDistributionDonut.jsx"></script>
    <script type="text/babel" src="src/components/charts/WeeklyDutyTrends.jsx"></script>
    
    <script type="text/babel" src="src/pages/ScheduleViewer.jsx"></script>
    <script type="text/babel" src="src/pages/AdminDashboard.jsx"></script>
    <script type="text/babel" src="src/pages/DoctorDashboard.jsx"></script>
    <script type="text/babel" src="src/pages/PatientBooking.jsx"></script>
    <script type="text/babel" src="src/pages/Login.jsx"></script>
    
    <script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
